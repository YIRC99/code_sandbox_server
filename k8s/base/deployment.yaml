apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-sandbox-deployment
  labels:
    app.kubernetes.io/name: code-sandbox
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: code-sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-sandbox
    spec:
      serviceAccountName: code-sandbox
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: code-sandbox
          image: harbor.internal.net/yunnan-agent/code-sandbox:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 32004
          envFrom:
            - configMapRef:
                name: code-sandbox-config
          env:
            - name: SANDBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: code-sandbox-secret
                  key: api-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: code-sandbox-uploads
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi

